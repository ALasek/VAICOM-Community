name: noVA standalone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VAICOM.Standalone.Tests/VAICOM.Standalone.Tests.csproj -p:IncludeWhisperCuda=false

      - name: Build Release
        run: dotnet build VAICOM.Standalone.Tests/VAICOM.Standalone.Tests.csproj -c Release -p:StandaloneBuild=true -p:IncludeWhisperCuda=false -m:1 --no-restore

      - name: Run standalone smoke tests
        run: .\VAICOM.Standalone.Tests\bin\Release\net472\VAICOM.Standalone.Tests.exe
